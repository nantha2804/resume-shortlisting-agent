[project]
name = "resume-shortlisting-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.3.0",
    "langgraph>=0.6.0",
    "pillow>=10.0.0",
    "pydantic>=2.9.0",
    "pypdf>=5.0.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.3",
    "reportlab>=4.0.0",
    "streamlit>=1.38.0",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.30.0",
]

[tool.vercel]
entrypoint = "api/index.py"
